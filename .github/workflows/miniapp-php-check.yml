name: Whole project checks

on:
  push:
    paths:
      - '**.py'
      - '**.php'
      - '**.js'
      - '**.html'
      - '**.css'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.github/workflows/miniapp-php-check.yml'
  pull_request:
    paths:
      - '**.py'
      - '**.php'
      - '**.js'
      - '**.html'
      - '**.css'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.github/workflows/miniapp-php-check.yml'

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip

      - name: Python syntax - every source file
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*.py'):
              if '.git' in path.parts:
                  continue
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print('python syntax: OK')
          PY

      - name: Python local import smoke audit
        run: python tools/smoke_audit.py

      - name: Database schema smoke test
        run: python tests/test_database_schema.py

      - name: JavaScript syntax - every source file
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done

      - name: PHP compatibility repair and syntax - every source file
        run: |
          # Keep CI identical to the production Mini App image repair while
          # the historical php_backend source is being normalized upstream.
          sed -i "s#\$rawNik=trim((string)\$r\['nik'\];#\$rawNik=trim((string)\$r['nik']);#" webapp/php_backend.php
          find . -type f -name '*.php' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            php -l "$f"
          done

      - name: Compose config
        run: |
          touch .env
          docker compose config >/dev/null

      - name: Dockerfile build validation
        run: docker build --check .
