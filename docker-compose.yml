services:
  telegram-ont-bot:
    build: .
    container_name: telegram-ont-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./evidence:/app/evidence
      - ./secrets:/app/secrets:ro

  kerja-bot-miniapp:
    build: .
    container_name: kerja-bot-miniapp
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "webapp/server_ext.py"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./database:/app/database:ro
